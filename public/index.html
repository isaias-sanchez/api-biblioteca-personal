<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Biblioteca Personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <div>
          <h1>Mi Biblioteca Personal</h1>
          <p class="subtitle">Gestiona tu colección de libros</p>
        </div>
      </div>
      <nav class="nav-pills">
        <button class="pill active" data-view="estantes">Estantes</button>
        <button class="pill" data-view="lista">Lista</button>
        <button class="pill" data-view="stats">Estadísticas</button>
      </nav>
      <button class="btn-add" id="btnOpenModal">+ Agregar libro</button>
    </div>
  </header>

  <!-- FILTROS -->
  <section class="filtros-bar">
    <div class="filtros-inner">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Buscar por título o autor…" autocomplete="off"/>
        <span class="search-icon">🔍</span>
      </div>
      <div class="filter-chips">
        <button class="chip active" data-estado="">Todos</button>
        <button class="chip" data-estado="pendiente">📌 Pendiente</button>
        <button class="chip" data-estado="leyendo">📖 Leyendo</button>
        <button class="chip" data-estado="leido">✅ Leído</button>
      </div>
    </div>
  </section>

  <!-- VISTAS -->
  <main class="main-content">

    <!-- Vista Estantes -->
    <section id="view-estantes" class="view active">
      <div class="shelf-room" id="shelfRoom">
        <div class="shelf-loading">Cargando tu biblioteca…</div>
      </div>
    </section>

    <!-- Vista Lista -->
    <section id="view-lista" class="view">
      <div class="table-wrap">
        <table class="books-table">
          <thead>
            <tr>
              <th>Título</th><th>Autor</th><th>Género</th>
              <th>Año</th><th>Estado</th><th>★</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Vista Stats -->
    <section id="view-stats" class="view">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-loading">Cargando estadísticas…</div>
      </div>
    </section>

  </main>

  <!-- MODAL AGREGAR / EDITAR -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Agregar libro</h2>
        <button class="modal-close" id="btnCloseModal">✕</button>
      </div>
      <form id="bookForm" class="modal-form">
        <input type="hidden" id="bookId"/>
        <div class="form-row">
          <div class="form-group full">
            <label>Título *</label>
            <input type="text" id="fTitulo" required placeholder="Ej: Cien años de soledad"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Autor *</label>
            <input type="text" id="fAutor" required placeholder="Ej: Gabriel García Márquez"/>
          </div>
          <div class="form-group">
            <label>Género *</label>
            <input type="text" id="fGenero" required placeholder="Ej: Realismo mágico"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Año de publicación</label>
            <input type="number" id="fAnio" min="0" max="2100" placeholder="Ej: 1967"/>
          </div>
          <div class="form-group">
            <label>Páginas</label>
            <input type="number" id="fPaginas" min="1" placeholder="Ej: 471"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Estado</label>
            <select id="fEstado">
              <option value="pendiente">📌 Pendiente</option>
              <option value="leyendo">📖 Leyendo</option>
              <option value="leido">✅ Leído</option>
            </select>
          </div>
          <div class="form-group">
            <label>Calificación (1-5)</label>
            <div class="star-input" id="starInput">
              <span class="star" data-val="1">★</span>
              <span class="star" data-val="2">★</span>
              <span class="star" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star" data-val="5">★</span>
            </div>
            <input type="hidden" id="fCalificacion"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label>Notas personales</label>
            <textarea id="fNotas" rows="3" placeholder="Apuntes, opinión, cita favorita…"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn-save">Guardar libro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
